# Test custom-header splitting with constant magic bytes and a length field.
# Header layout (header_length = 4):
#   byte 0-1: constant magic 0xAA 0x55
#   byte 2-3: uint16 big-endian total message length (header + payload)
[[inputs.socket_listener]]
  service_address = "tcp://127.0.0.1:0"
  splitting_strategy = "custom header"
  splitting_custom_header = {const_bytes = {"0" = "0xAA", "1" = "0x55"}, length_field = {offset = 2, bytes = 2, endianness = "be", header_length = 4}}
